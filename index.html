<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BARKLA'S PREMIER LEAGUE 26/27</title>
<link rel="icon" href="crests/league.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0c0e;color:#fff;font-family:'Roboto Condensed','Arial Narrow',sans-serif}
  .bg{position:fixed;inset:0;z-index:0;background:#0b0c0e url('bg/practice-arena.jpg') center 30%/cover no-repeat}
  .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,11,.30) 0%,rgba(8,9,11,.50) 45%,rgba(8,9,11,.72) 100%)}
  .page{position:relative;z-index:1;min-height:100vh}
  .wrap{max-width:1320px;margin:0 auto;padding:28px 24px 32px}
  .tx{text-shadow:0 2px 0 rgba(0,0,0,.5)}
  button{font-family:inherit}
  button:focus-visible{outline:3px solid #ffffff;outline-offset:-3px}
  /* header */
  .hbar{display:flex;flex-wrap:wrap;align-items:center;gap:18px;padding:10px 24px 10px 36px;background:linear-gradient(180deg,#ea4a42 0%,#c81e23 46%,#a10f15 54%,#b8181e 100%);border-top:2px solid rgba(255,255,255,.6);clip-path:polygon(22px 0,100% 0,100% 100%,0 100%);box-shadow:0 6px 18px rgba(0,0,0,.5)}
  .hcrest{width:88px;height:auto;margin:-14px 0 -18px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
  .hbar h1{margin:0;font:900 38px/1.05 'Roboto Condensed',sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .hright{margin-left:auto;font:800 18px 'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .dbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:10px 24px;background:linear-gradient(180deg,#3d4045 0%,#1f2125 48%,#131417 52%,#1d1f23 100%);border-bottom:1px solid #000}
  .dbar .a{font:800 25px 'Roboto Condensed',sans-serif}
  .dbar .b{font:700 18px 'Roboto Condensed',sans-serif;color:#e3e5e8}
  .dright{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .dl{display:inline-flex;align-items:center;gap:10px;padding:5px 12px;background:linear-gradient(180deg,#0c0d0f,#25282d);border:1px solid #8f9398;transition:opacity .25s}
  .dl.swap{opacity:0}
  .dl-label{font:800 13px 'Roboto Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#c3c7cc}
  .dl-value{font:900 19px 'Roboto Condensed',sans-serif;color:#fff;font-variant-numeric:tabular-nums;min-width:150px}
  .dl.urgent{border-color:#ea4a42}.dl.urgent .dl-value{color:#ff8a80}
  /* menu */
  .menu{display:flex;margin-top:22px;background:linear-gradient(180deg,#4a4d52,#16171a);border-top:2px solid #a3a6ab;border-bottom:2px solid #a3a6ab;box-shadow:0 10px 24px rgba(0,0,0,.55)}
  .menu-tabs{display:flex;flex:1;overflow-x:auto;min-width:0}
  .mtab{flex:1 0 auto;min-width:150px;min-height:60px;padding:0 18px;border:none;border-right:2px solid rgba(0,0,0,.6);box-shadow:inset 1px 0 0 rgba(255,255,255,.14);font:800 19px 'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;color:#f2f2f2;text-shadow:0 2px 0 rgba(0,0,0,.5);background:linear-gradient(180deg,#6e1418 0%,#4e0b0e 48%,#3c0709 52%,#521014 100%)}
  .mtab:hover{filter:brightness(1.2)}
  .mtab.on{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);background:linear-gradient(180deg,#f2564c 0%,#d52429 46%,#b3151b 54%,#cc2127 100%)}
  .arrow{width:54px;flex:0 0 54px;border:none;background:linear-gradient(180deg,#45484d,#1a1b1e);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .arrow:hover{background:linear-gradient(180deg,#5a5e64,#26282c)}
  /* panels */
  .row-wrap{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .panel{background:#17191c;border:3px solid #cfd2d6;box-shadow:0 12px 30px rgba(0,0,0,.6);min-width:0}
  .panel-title{display:flex;align-items:center;gap:14px;padding:14px 20px;background:linear-gradient(180deg,#8e9399 0%,#666b71 46%,#4c5157 54%,#60656b 100%);border-bottom:1px solid #2a2d31}
  .ptitle{margin:0;font:900 32px/1.05 'Roboto Condensed',sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .pnote{font:700 17px 'Roboto Condensed',sans-serif;color:#eef0f2;text-shadow:0 1px 0 rgba(0,0,0,.5)}
  .panel-sub{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:linear-gradient(180deg,#fbfbfb 0%,#e3e3e3 48%,#cdcdcd 52%,#e8e8e8 100%);color:#131313;border-bottom:2px solid #0d0e10}
  .sublabel{font:800 21px 'Roboto Condensed',sans-serif;color:#131313;margin-left:6px}
  .key,.keybtn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:30px;padding:0 6px;background:linear-gradient(180deg,#fff,#cfcfcf);border:1px solid #7d7d7d;border-radius:6px;color:#1a1a1a;font:800 15px 'Roboto Condensed',sans-serif;box-shadow:inset 0 1px 0 #fff,0 2px 3px rgba(0,0,0,.35)}
  .keybtn{min-height:44px;min-width:48px;cursor:pointer}
  .keybtn:hover{background:linear-gradient(180deg,#fff,#e4e4e4)}
  .keybtn:disabled{opacity:.45;cursor:default}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .trow{display:grid;grid-template-columns:56px 40px minmax(200px,1fr) repeat(4,58px) 90px 80px;align-items:center;gap:8px;width:100%;min-height:52px;padding:4px 14px;border:none;border-bottom:1px solid #0d0e10;text-align:left;cursor:pointer;font:700 20px 'Roboto Condensed',sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .trow:hover{filter:brightness(1.18)}
  .thead{background:#0e0f11;cursor:default;font:800 19px 'Roboto Condensed',sans-serif;min-height:44px}
  .thead:hover{filter:none}
  .n{text-align:right;font-variant-numeric:tabular-nums}
  .c{text-align:center}
  .team{display:block;font:800 20px/1.15 'Roboto Condensed',sans-serif}
  .mgr{display:block;font:500 14px/1.2 'Roboto Condensed',sans-serif;color:#c3c7cc}
  .crest{width:36px;height:45px;object-fit:contain;display:block;flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .crest.big{width:64px;height:80px}
  .crest.tiny{width:18px;height:22px;filter:none}
  .alt0{background:linear-gradient(180deg,#2c2f34,#23262a)}
  .alt1{background:linear-gradient(180deg,#24272b,#1c1e21)}
  .hl{background:linear-gradient(180deg,#a6e566 0%,#7cc63e 48%,#62ad2a 52%,#74bd36 100%) !important;color:#0b1704 !important;text-shadow:none !important}
  .hl .mgr,.hl .sub{color:#1f3a0e !important}
  .mitem{display:block;width:100%;min-height:44px;padding:0 16px;border:none;border-bottom:1px solid #0d0e10;text-align:left;font:700 18px 'Roboto Condensed',sans-serif;cursor:pointer;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.5);background:linear-gradient(180deg,#2c2f34,#1e2024)}
  .mitem:hover{filter:brightness(1.2)}
  .mitem.on{background:linear-gradient(180deg,#fff,#d9d9d9);color:#111;text-shadow:none}
  .card{background:linear-gradient(180deg,#f6f6f6 0%,#e4e4e4 50%,#d2d2d2 100%);color:#111;padding:12px 14px;border:1px solid #8f9398}
  .card-cap{font:800 14px 'Roboto Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#a8121a}
  .card-val{font:900 32px/1.1 'Roboto Condensed',sans-serif;margin-top:6px;color:#111}
  .card-note{font:700 16px 'Roboto Condensed',sans-serif;color:#4a4d52}
  .boxhead{background:linear-gradient(180deg,#3a3d42,#17181b);color:#fff;font:800 18px 'Roboto Condensed',sans-serif;text-transform:uppercase;padding:8px 12px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
  .greenbar{background:linear-gradient(180deg,#a6e566 0%,#7cc63e 48%,#62ad2a 52%,#74bd36 100%);color:#0b1704;font:800 17px 'Roboto Condensed',sans-serif;padding:6px 12px}
  .lightbody{background:linear-gradient(180deg,#f6f6f6,#d8d8d8);color:#111;padding:12px;display:flex;align-items:center;gap:12px}
  .seg{display:inline-block;width:30px;height:12px;border:1px solid #0d0e10;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);background:#2c2f34}
  .seg.on{background:linear-gradient(180deg,#8be65a,#2f9a1c)}
  .hl .seg.on{background:#0b1704}.hl .seg{border-color:#0b1704;background:transparent}
  .lrow{display:grid;grid-template-columns:44px 40px minmax(160px,1fr) 120px 64px;align-items:center;gap:8px;min-height:50px;padding:4px 14px;border-bottom:1px solid #0d0e10;font:700 19px 'Roboto Condensed',sans-serif}
  .lrow.dead{color:#9aa0a7}.lrow.dead .nm{text-decoration:line-through}
  .gwbox{width:44px;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 14px/1.05 'Roboto Condensed',sans-serif;border:1px solid #0d0e10}
  .gwbox small{font-size:11px}
  .gw-single{background:#2c2f34;color:#d9dce0}.gw-double{background:#e0a21b;color:#111}.gw-triple{background:#c81e23;color:#fff}.gw-bomb{background:#19b8d6;color:#04161b}
  .gwbox.past{opacity:.45}.gwbox.now{outline:2px solid #fff;outline-offset:1px}
  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;font:700 15px 'Roboto Condensed',sans-serif;color:#d9dce0}
  .legend i{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border:1px solid #0d0e10}
  .fx{display:grid;grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr);align-items:center;gap:14px;min-height:62px;padding:6px 18px;border-bottom:1px solid #0d0e10}
  .fx-side{display:flex;align-items:center;gap:10px;min-width:0;font:800 20px 'Roboto Condensed',sans-serif}
  .fx-side.lose{color:#aeb3ba}
  .scorebox{display:flex;align-items:center;justify-content:center;gap:12px;height:42px;background:linear-gradient(180deg,#2e3136,#0c0d0f);border:2px solid #8f9398;font:900 26px 'Roboto Condensed',sans-serif}
  .scorebox .lose{color:#8f9398}.scorebox .sep{color:#8f9398}
  .luckrow{display:grid;grid-template-columns:minmax(180px,1.3fr) 60px 84px 70px minmax(200px,1.4fr);align-items:center;gap:10px;min-height:46px;padding:4px 16px;border-bottom:1px solid #0d0e10;font:700 19px 'Roboto Condensed',sans-serif}
  .bars{display:flex;align-items:center;height:18px}
  .bars .h{flex:1;display:flex;height:100%;background:#101113}
  .bars .neg{justify-content:flex-end}
  .bars .neg i{display:block;height:100%;background:linear-gradient(180deg,#ff6b5e,#b5161c)}
  .bars .pos i{display:block;height:100%;background:linear-gradient(180deg,#a6e566,#4f9a1f)}
  .bars .axis{width:2px;height:26px;background:#cfd2d6}
  .good{color:#9be05a}.bad{color:#ff7a6e}
  .team,.fx-side,.fxm-n,.nm{overflow-wrap:anywhere;min-width:0}
  .mrec,.fxm{display:none}
  .lastres{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px 12px;padding:12px 14px;background:#1d1f23}
  .lr-n{font:800 18px 'Roboto Condensed',sans-serif;overflow-wrap:break-word;min-width:0}
  .lr-tag{grid-column:1 / -1;justify-self:center;font:900 16px 'Roboto Condensed',sans-serif;padding:4px 10px}
  .gbox{min-width:0}
  .empty{padding:18px;color:#c3c7cc;font:600 17px 'Roboto Condensed',sans-serif}
  /* footer */
  footer{margin-top:40px}
  .foot{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:6px 18px 6px 116px;min-height:58px;position:relative;background:linear-gradient(180deg,#fff 0%,#e9e9e9 48%,#d3d3d3 52%,#ececec 100%);color:#151515;border-top:2px solid #8f9398}
  .badge{position:absolute;left:8px;top:-26px;width:96px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
  .prompt{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;border:none;background:transparent;color:#151515;font:800 20px 'Roboto Condensed',sans-serif;cursor:pointer}
  .prompt:hover{text-decoration:underline}
  .plabel{font:800 20px 'Roboto Condensed',sans-serif}
  .btn-x{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5aa7ff,#0b55c9);color:#fff;font:900 16px 'Roboto Condensed',sans-serif;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)}
  .updated{margin-left:auto;font:700 16px 'Roboto Condensed',sans-serif;color:#33363b}
  .ticker{display:flex;align-items:stretch;background:linear-gradient(180deg,#26282c,#0b0c0e);border-top:1px solid #000;overflow:hidden}
  .tick-label{flex:0 0 auto;display:flex;align-items:center;padding:0 16px;font:900 17px 'Roboto Condensed',sans-serif;background:linear-gradient(180deg,#ea4a42 0%,#c81e23 46%,#a10f15 54%,#b8181e 100%)}
  .tick-win{flex:1;overflow:hidden;min-width:0}
  .tick-track{display:flex;width:max-content;animation:tick 60s linear infinite}
  .tick-item{padding:10px 44px 10px 0;white-space:nowrap;font:700 18px 'Roboto Condensed',sans-serif;color:#e6e8eb}
  .tick-item b{color:#fff;font-weight:800}
  .tick-score{color:#fff;font-weight:900;margin:0 8px}
  @keyframes tick{to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){.tick-track{animation:none}}
  @media (max-width:640px){
    .wrap{padding:14px 10px 24px}
    .hbar{gap:10px 14px;padding:8px 14px 8px 26px}
    .hbar h1{font-size:24px}.hcrest{width:60px;margin:-10px 0 -12px}
    .hright{font-size:14px}
    .dbar{padding:8px 14px}.dbar .a{font-size:20px}.dbar .b{font-size:16px}
    .dl{padding:4px 10px;gap:8px}.dl-label{font-size:11px}.dl-value{font-size:16px;min-width:0}
    .menu{margin-top:16px}
    .arrow{width:40px;flex-basis:40px}
    .mtab{min-width:0;min-height:50px;padding:0 14px;font-size:16px}
    #view{padding-top:16px !important}
    .row-wrap{gap:14px}
    .panel{border-width:2px}
    .panel-title{padding:10px 14px;gap:10px}
    .ptitle{font-size:23px}.pnote{font-size:15px}
    .panel-sub{padding:6px 10px}.sublabel{font-size:18px}
    .panel-sub > .key{display:none}
    .crest.big{width:52px;height:65px}
    /* manager picker: one swipeable row of chips */
    .mlist{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .mlist::-webkit-scrollbar{display:none}
    .mlist .mitem{flex:0 0 auto;width:auto;white-space:nowrap;border-bottom:none;border-right:1px solid #0d0e10;font-size:16px;padding:0 14px}
    /* my club */
    .stats{grid-template-columns:repeat(2,minmax(0,1fr)) !important;padding:12px !important;gap:10px !important}
    .card{padding:10px 12px}.card-cap{font-size:12px}.card-val{font-size:26px}.card-note{font-size:14px}
    .seg{width:22px}
    .gbox{flex:1 1 100% !important}
    .lastres{gap:8px;padding:10px}
    .lr-n{font-size:16px;overflow-wrap:anywhere}
    /* league table: rank, crest, team (+ record line), points */
    .tblw{min-width:0 !important}
    .trow{grid-template-columns:30px 36px minmax(0,1fr) 44px;gap:8px;padding:6px 10px;font-size:18px}
    .dcol{display:none}
    .thead{font-size:15px;white-space:nowrap}
    .mrec{display:block;font:600 13px 'Roboto Condensed',sans-serif;color:#d0d4d9;margin-top:2px}
    .hl .mrec{color:#1f3a0e}
    .team{font-size:18px}.mgr{font-size:13px}
    /* last man standing */
    .lmsw{min-width:0 !important}
    .lrow{grid-template-columns:26px 34px minmax(0,1fr) 72px 40px;gap:6px;padding:4px 10px;font-size:16px}
    .lrow .seg{width:20px;height:10px}
    .gwbox{width:40px;height:38px}
    /* results: stacked scoreboard per fixture */
    .fx{display:none}
    .fxm{display:block;padding:6px 10px;border-bottom:1px solid #0d0e10}
    .fxm-row{display:grid;grid-template-columns:30px minmax(0,1fr) 48px;align-items:center;gap:10px;min-height:42px;font:800 17px 'Roboto Condensed',sans-serif}
    .fxm-row .crest{width:28px;height:35px}
    .fxm-row.lose{color:#aeb3ba}
    .fxm-s{justify-self:end;min-width:44px;text-align:center;padding:4px 0;background:linear-gradient(180deg,#2e3136,#0c0d0f);border:1px solid #8f9398;font:900 20px 'Roboto Condensed',sans-serif;color:#fff}
    .fxm-row.lose .fxm-s{color:#8f9398}
    /* luck: numbers on one line, bar underneath */
    .luckw{min-width:0 !important}
    .luckrow{grid-template-columns:minmax(0,1fr) 34px 52px 50px;gap:6px 8px;padding:6px 10px;font-size:16px}
    .luckrow > :first-child{overflow-wrap:anywhere;min-width:0}
    .luckrow > :nth-child(5){grid-column:1 / -1}
    .bars{height:10px}.bars .axis{height:16px}
    /* footer */
    footer{margin-top:28px}
    .foot{padding:6px 10px 6px 86px;gap:4px 10px}
    .badge{width:72px;top:-18px;left:6px}
    .prompt{font-size:16px;padding:0 2px}.plabel{font-size:16px}
    .updated{margin-left:0;flex-basis:100%;font-size:13px}
    .tick-item{font-size:15px}.tick-label{font-size:15px;padding:0 10px}
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="page"><div class="wrap">

<header class="hbar">
  <img class="hcrest" src="crests/league.svg" alt="">
  <h1 id="lname"></h1>
  <span class="hright" id="lid"></span>
</header>
<div class="dbar"><span class="a tx" id="gwnow"></span><span class="dright"><span class="b tx" id="gwnext"></span><span class="dl" id="dl"><span class="dl-label" id="dlLabel"></span><span class="dl-value" id="dlValue"></span></span></span></div>

<nav class="menu" aria-label="Dashboard sections">
  <button class="arrow" data-act="prevTab" aria-label="Previous tab"><svg width="18" height="24" viewBox="0 0 18 24" aria-hidden="true"><path d="M14 2 L4 12 L14 22" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></button>
  <div class="menu-tabs" id="tabs"></div>
  <button class="arrow" data-act="nextTab" aria-label="Next tab"><svg width="18" height="24" viewBox="0 0 18 24" aria-hidden="true"><path d="M4 2 L14 12 L4 22" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg></button>
</nav>

<main id="view" style="padding-top:24px"></main>

<footer>
  <div class="foot">
    <img class="badge" src="crests/league.svg" alt="">
    <span style="display:inline-flex;align-items:center;gap:4px">
      <button class="prompt" data-act="prevTab" aria-label="Previous tab"><span class="key">LB</span></button>
      <button class="prompt" data-act="nextTab" aria-label="Next tab"><span class="key">RB</span></button>
      <span class="plabel">Switch tab</span>
    </span>
    <span id="fctx" style="display:inline-flex;align-items:center;gap:4px"></span>
    <span class="updated" id="updated"></span>
  </div>
  <div class="ticker" id="ticker"></div>

      + '<span class="lr-n" style="text-align:right">'+esc(last.e1)+'</span>'
      + '<span class="scorebox" style="padding:0 14px"><span>'+last.s1+'</span><span class="sep">:</span><span>'+last.s2+'</span></span>'
      + '<span class="lr-n">'+esc(last.e2)+'</span>'
      + '<span class="lr-tag" style="'+tag+'">'+oc+'</span></div>';
  }
  const mini = M.map((r,i) => '<div class="'+(r.entry===S.mgr?'hl':alt(i))+'" style="display:grid;grid-template-columns:26px 20px minmax(0,1fr) 24px 34px;align-items:center;gap:6px;padding:3px 12px;min-height:30px;border-bottom:1px solid #0d0e10;font:700 15px \'Roboto Condensed\',sans-serif">'
      + '<span class="n">'+nz(r.h2h_rank)+'</span>'+crest(r.entry,'tiny')
      + '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.entry_name)+'</span>'
      + '<span class="n">'+nz(r.played,0)+'</span><span class="n" style="font-weight:900">'+nz(r.h2h_points,0)+'</span></div>').join('');
  return '<div class="row-wrap">'
    + '<section class="panel" style="flex:1 1 230px"><div class="panel-sub"><span class="sublabel">Managers</span></div><div class="mlist">'+mgrList()+'</div></section>'
    + '<section class="panel" style="flex:999 1 520px">'
    +   '<div class="panel-title">'+crest(m.entry,'big')+'<div><h2 class="ptitle">'+esc(m.entry_name)+'</h2><div class="pnote">'+esc(m.player_name)+'</div></div></div>'
    +   '<div class="panel-sub"><span class="key" aria-hidden="true">LT</span><span class="key" aria-hidden="true">RT</span><span class="sublabel">Manager overview</span></div>'
    +   '<div class="stats" style="padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px">'
    +     stats.map(s => '<div class="card"><div class="card-cap">'+s[0]+'</div><div class="card-val">'+s[1]+' <span class="card-note">'+s[2]+'</span></div></div>').join('')
    +     '<div class="card"><div class="card-cap">LMS lives</div>'+livesHtml+'</div>'
    +   '</div>'
    +   '<div style="padding:0 16px 16px;display:flex;flex-wrap:wrap;gap:12px">'
    +     '<div class="gbox" style="flex:1 1 240px;border:2px solid #9a9da2"><div class="boxhead">Next game</div><div class="greenbar">Gameweek '+nz(D.next_gw,'')+'</div>'
    +       '<div class="lightbody">'+(opp?crest(opp.entry)+'<span style="font:800 20px \'Roboto Condensed\',sans-serif">vs '+esc(opp.name)+'</span>':'<span>No fixture</span>')+'</div></div>'
    +     '<div class="gbox" style="flex:2 1 320px;border:2px solid #9a9da2"><div class="boxhead">Latest result · Gameweek '+nz(D.current_gw,'')+'</div>'+lastHtml+'</div>'
    +   '</div>'
    + '</section>'
    + '<section class="panel" style="flex:1 1 280px"><div class="panel-sub"><span class="sublabel">H2H table</span><span style="margin-left:auto;font:800 15px \'Roboto Condensed\',sans-serif">P&nbsp;&nbsp;&nbsp;PTS</span></div><div>'+mini+'</div></section>'
    + '</div>';
}

function viewTable(){
  if (!M.length) return empty('No managers yet.');
  const rows = M.slice();
  if (S.sort==='pf') rows.sort((a,b) => (b.points_for||0)-(a.points_for||0));
  const body = rows.map((m,i) => '<button class="trow '+(m.entry===S.mgr?'hl':alt(i))+'" data-mgr="'+esc(m.entry)+'" aria-pressed="'+(m.entry===S.mgr)+'">'
      + '<span class="c">'+(S.sort==='pf'?i+1:nz(m.h2h_rank))+'</span>'+crest(m.entry)
      + '<span class="nmcell"><span class="team">'+esc(m.entry_name)+'</span><span class="mgr">'+esc(m.player_name)+'</span>'
      +   '<span class="mrec">'+nz(m.won,0)+'W '+nz(m.drawn,0)+'D '+nz(m.lost,0)+'L · '+fmt(m.points_for)+' PF</span></span>'
      + '<span class="n dcol">'+nz(m.played,0)+'</span><span class="n dcol">'+nz(m.won,0)+'</span><span class="n dcol">'+nz(m.drawn,0)+'</span><span class="n dcol">'+nz(m.lost,0)+'</span>'
      + '<span class="n dcol">'+fmt(m.points_for)+'</span><span class="n" style="font-weight:900">'+nz(m.h2h_points,0)+'</span></button>').join('');
  return '<section class="panel">'
    + '<div class="panel-title"><h2 class="ptitle">H2H League Table</h2><span class="pnote" style="margin-left:auto">After Gameweek '+nz(D.current_gw,'')+'</span></div>'
    + '<div class="panel-sub"><span class="key" aria-hidden="true">LT</span><span class="key" aria-hidden="true">RT</span><span class="sublabel">League Stage</span>'
    +   '<span style="margin-left:auto;display:flex;align-items:center;gap:8px"><button class="keybtn" data-act="sort" aria-label="Change sort order">X</button><span style="font:800 17px \'Roboto Condensed\',sans-serif">Sort: '+(S.sort==='pts'?'H2H points':'Points for')+'</span></span></div>'
    + '<div class="scroll"><div class="tblw" style="min-width:760px">'
    +   '<div class="trow thead"><span class="c">#</span><span></span><span>Manager</span><span class="n dcol">P</span><span class="n dcol">W</span><span class="n dcol">D</span><span class="n dcol">L</span><span class="n dcol">'+(S.sort==='pf'?'▼ ':'')+'PF</span><span class="n">'+(S.sort==='pts'?'▼ ':'')+'PTS</span></div>'
    +   body + '</div></div></section>';
}

function viewLms(){
  const L = D.lms_standings || [];
  if (!L.length) return '<section class="panel"><div class="panel-title"><h2 class="ptitle">Last Man Standing</h2></div>'+empty('Last Man Standing has not been set up yet. Run <code>lms.py allocate</code> after GW1.')+'</section>';
  const alive = L.filter(r => r.lives_left>0).length;
  const rows = L.map((r,i) => {
    const ok = r.lives_left>0;
    return '<div class="lrow '+(r.entry===S.mgr?'hl':alt(i))+(ok?'':' dead')+'">'
      + '<span class="c">'+nz(r.position)+'</span>'+crest(r.entry)
      + '<span class="nm">'+esc(r.entry_name)+(r.status==='WINNER'?' <span style="font:900 13px \'Roboto Condensed\',sans-serif;padding:2px 6px;background:#f2c94c;color:#111">WINNER</span>':'')+'</span>'
      + '<span style="display:flex;gap:5px" role="img" aria-label="'+(ok?r.lives_left+' of 3 lives left':'Eliminated')+'">'+segs(r.lives_left||0)+'</span>'
      + '<span class="n">'+(ok?'':'GW'+nz(r.eliminated_gw,'?'))+'</span></div>';
  }).join('');
  const sched = (D.lms_schedule||[]).map(s => {
    const mark = s.type==='double'?'×2':s.type==='triple'?'×3':s.type==='bomb'?'BOMB':'';
    const cls = ['gwbox','gw-'+s.type];
    if (D.current_gw && s.event<=D.current_gw) cls.push('past');
    if (D.next_gw && s.event===D.next_gw) cls.push('now');
    return '<div class="'+cls.join(' ')+'" title="GW'+s.event+' · '+s.type+'"><span>'+s.event+'</span><small>'+mark+'</small></div>';
  }).join('');
  const log = [];
  for (let g = D.current_gw||0; g >= 1; g--) ((D.lms_events||{})[String(g)]||[]).forEach(e => log.push([g,e]));
  const logHtml = log.length ? log.map(([g,e],i) => '<div class="'+alt(i)+'" style="display:grid;grid-template-columns:64px minmax(0,1fr) 48px 50px;align-items:center;gap:8px;min-height:38px;padding:2px 14px;border-bottom:1px solid #0d0e10;font:700 17px \'Roboto Condensed\',sans-serif">'
      + '<span style="font-weight:900;color:#e3e5e8">GW'+g+'</span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(e.name)+'</span>'
      + '<span class="n">'+e.score+'</span><span style="font:900 13px \'Roboto Condensed\',sans-serif;text-align:center;padding:2px 4px;color:#fff;background:'+(e.out?'#b5161c':'#4b5057')+'">'+(e.out?'OUT':'−1')+'</span></div>').join('') : empty('No lives lost yet.');
  return '<div class="row-wrap">'
    + '<section class="panel" style="flex:999 1 560px"><div class="panel-title"><h2 class="ptitle">Last Man Standing</h2><span class="pnote" style="margin-left:auto">'+alive+' alive · '+(L.length-alive)+' out</span></div>'
    +   '<div class="panel-sub"><span class="key" aria-hidden="true">LT</span><span class="key" aria-hidden="true">RT</span><span class="sublabel">Survivors</span></div>'
    +   '<div class="scroll"><div class="lmsw" style="min-width:520px"><div class="lrow" style="background:#0e0f11;font-weight:800;min-height:40px"><span class="c">#</span><span></span><span>Manager</span><span>Lives</span><span class="n">Out</span></div>'+rows+'</div></div></section>'
    + '<div style="flex:1 1 380px;display:flex;flex-direction:column;gap:20px;min-width:0">'
    +   '<section class="panel"><div class="panel-sub"><span class="sublabel">Elimination schedule</span>'+(D.next_gw?'<span style="margin-left:auto;font:700 15px \'Roboto Condensed\',sans-serif">Next: GW'+D.next_gw+'</span>':'')+'</div>'
    +     '<div style="padding:16px">'+(sched?'<div style="display:flex;flex-wrap:wrap;gap:5px">'+sched+'</div>':'<span class="empty">Not allocated yet.</span>')
    +     '<div class="legend"><span><i class="gw-single"></i>Single</span><span><i class="gw-double"></i>Double ×2</span><span><i class="gw-triple"></i>Triple ×3</span><span><i class="gw-bomb"></i>Bomb</span></div></div></section>'
    +   '<section class="panel"><div class="panel-sub"><span class="sublabel">Lives lost</span></div><div>'+logHtml+'</div></section>'
    + '</div></div>';
}

function viewResults(){
  if (!gws.length) return '<section class="panel"><div class="panel-title"><h2 class="ptitle">Gameweek Results</h2></div>'+empty('No results yet.')+'</section>';
  const g = S.gw, rows = (D.weekly[String(g)]||[]);
  const fx = rows.map((f,i) => {
    const w1 = f.s1>f.s2, w2 = f.s2>f.s1;
    return '<div class="fx '+alt(i)+'">'
      + '<span class="fx-side'+(w2?' lose':'')+'" style="justify-content:flex-end;text-align:right">'+esc(f.e1)+crestByName(f.e1)+'</span>'
      + '<span class="scorebox"><span class="'+(w2?'lose':'')+'">'+f.s1+'</span><span class="sep">:</span><span class="'+(w1?'lose':'')+'">'+f.s2+'</span></span>'
      + '<span class="fx-side'+(w1?' lose':'')+'">'+crestByName(f.e2)+esc(f.e2)+'</span></div>'
      + '<div class="fxm '+alt(i)+'">'
      +   '<div class="fxm-row'+(w2?' lose':'')+'">'+crestByName(f.e1)+'<span class="fxm-n">'+esc(f.e1)+'</span><span class="fxm-s">'+f.s1+'</span></div>'
      +   '<div class="fxm-row'+(w1?' lose':'')+'">'+crestByName(f.e2)+'<span class="fxm-n">'+esc(f.e2)+'</span><span class="fxm-s">'+f.s2+'</span></div></div>';
  }).join('');
  const ev = ((D.lms_events||{})[String(g)]||[]);
  const lms = ev.length ? '<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;background:linear-gradient(180deg,#2e3136,#17191c);font:700 18px \'Roboto Condensed\',sans-serif">'
      + '<span style="font:900 15px \'Roboto Condensed\',sans-serif;padding:3px 10px;background:#d52429;color:#fff">LMS</span>'
      + ev.map(e => esc(e.name)+' ('+e.score+') '+(e.out?'is eliminated':'loses a life')).join(' · ')+'</div>' : '';
  return '<section class="panel"><div class="panel-title"><h2 class="ptitle">Gameweek Results</h2></div>'
    + '<div class="panel-sub"><button class="keybtn" data-act="prevGw" aria-label="Previous gameweek"'+(g<=gws[0]?' disabled':'')+'>LT</button>'
    +   '<span class="sublabel" style="min-width:150px;text-align:center">Gameweek '+g+'</span>'
    +   '<button class="keybtn" data-act="nextGw" aria-label="Next gameweek"'+(g>=gws[gws.length-1]?' disabled':'')+'>RT</button></div>'
    + '<div>'+fx+'</div>'+lms+'</section>';
}

function viewForm(){
  const H = D.position_history||{}, ids = Object.keys(H);
  const m = byId[S.mgr];
  if (!ids.length || !m) return '<section class="panel"><div class="panel-title"><h2 class="ptitle">League Position by Gameweek</h2></div>'+empty('No gameweeks played yet.')+'</section>';
  const n = M.length, len = Math.max(...ids.map(i => H[i].length));
  const narrow = window.innerWidth <= 640;
  const fs = narrow ? 14 : 12;
  const W = narrow ? 400 : 880, HT = narrow ? Math.max(300, n*24+44) : Math.max(240, n*20+44), P = {t:16, r:16, b:28, l:30};
  const x = i => P.l + (len<2 ? 0 : i*(W-P.l-P.r)/(len-1));
  const y = p => P.t + (n<2 ? 0 : (p-1)*(HT-P.t-P.b)/(n-1));
  let s = '<svg viewBox="0 0 '+W+' '+HT+'" style="width:100%;height:auto;display:block" role="img" aria-label="League position by gameweek, '+esc(m.entry_name)+' highlighted">';
  for (let p = 1; p <= n; p += Math.max(1, Math.round(n/4))) {
    s += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="#26292d"/>'
       + '<text x="'+(P.l-10)+'" y="'+(y(p)+4)+'" fill="#c3c7cc" font-size="'+fs+'" text-anchor="end" font-family="Roboto Condensed, sans-serif">'+p+'</text>';
  }
  for (let i = 0; i < len; i += Math.max(1, Math.ceil(len/10)))
    s += '<text x="'+x(i)+'" y="'+(HT-6)+'" fill="#c3c7cc" font-size="'+fs+'" text-anchor="middle" font-family="Roboto Condensed, sans-serif">'+(narrow?'':'GW')+(i+1)+'</text>';
  const line = id => H[id].map((p,i) => x(i)+','+y(p)).join(' ');
  ids.forEach(id => { if (id!==S.mgr) s += '<polyline points="'+line(id)+'" fill="none" stroke="#4b5057" stroke-width="1.4" stroke-linejoin="round"><title>'+esc((byId[id]||{}).entry_name||id)+'</title></polyline>'; });
  const hp = H[S.mgr]||[];
  if (hp.length) s += '<polyline points="'+line(S.mgr)+'" fill="none" stroke="#9be05a" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>'
                    + '<circle cx="'+x(hp.length-1)+'" cy="'+y(hp[hp.length-1])+'" r="6" fill="#9be05a" stroke="#0b1704" stroke-width="2"/>';
  s += '</svg>';
  return '<div class="row-wrap">'
    + '<section class="panel" style="flex:1 1 230px"><div class="panel-sub"><span class="sublabel">Highlight</span></div><div class="mlist">'+mgrList()+'</div></section>'
    + '<section class="panel" style="flex:999 1 620px"><div class="panel-title"><h2 class="ptitle">League Position by Gameweek</h2></div>'
    +   '<div class="panel-sub"><span class="key" aria-hidden="true">LT</span><span class="key" aria-hidden="true">RT</span><span class="sublabel">'+esc(m.entry_name)+': now '+nz(m.h2h_rank)+' of '+n+'</span></div>'
    +   '<div style="padding:18px 16px 12px">'+s+'</div></section></div>';
}

function viewLuck(){
  const R = D.luck||[];
  const head = '<section class="panel"><div class="panel-title"><h2 class="ptitle">Luck: Points Won vs Deserved</h2></div>'
    + '<div class="panel-sub"><span style="font:700 16px \'Roboto Condensed\',sans-serif;color:#1d1f23;padding:4px 6px">Expected points are what each manager would have averaged playing the whole league each week instead of one drawn opponent. Positive means the fixtures have been kind.</span></div>';
  if (!R.length) return head + empty('No results yet.') + '</section>';
  const mx = Math.max(1, ...R.map(r => Math.abs(r.luck)));
  const rows = R.map((r,i) => {
    const good = r.luck>=0, w = (Math.abs(r.luck)/mx*100).toFixed(1)+'%', on = r.entry===S.mgr;
    return '<div class="luckrow '+(on?'hl':alt(i))+'">'
      + '<span style="font-weight:800">'+esc(r.entry_name)+'</span><span class="n">'+r.actual+'</span>'
      + '<span class="n sub" style="color:#c3c7cc">'+r.expected.toFixed(1)+'</span>'
      + '<span class="n '+(on?'':(good?'good':'bad'))+'" style="font-weight:900">'+(good?'+':'')+r.luck.toFixed(1)+'</span>'
      + '<span class="bars"><span class="h neg"><i style="width:'+(good?'0%':w)+'"></i></span><span class="axis"></span><span class="h pos"><i style="width:'+(good?w:'0%')+'"></i></span></span></div>';
  }).join('');
  return head + '<div class="scroll"><div class="luckw" style="min-width:720px"><div class="luckrow" style="background:#0e0f11;font-weight:800;min-height:40px"><span>Manager</span><span class="n">Pts</span><span class="n">Expected</span><span class="n">Diff</span><span style="text-align:center">Unlucky · Lucky</span></div>'+rows+'</div></div></section>';
}

const VIEWS = { club:viewClub, table:viewTable, lms:viewLms, results:viewResults, form:viewForm, luck:viewLuck };

function render(){
  $('tabs').innerHTML = TABS.map(([id,label]) => '<button class="mtab'+(id===S.tab?' on':'')+'" data-tab="'+id+'"'+(id===S.tab?' aria-current="page"':'')+'>'+label+'</button>').join('');
  $('view').innerHTML = VIEWS[S.tab]();
  let ctx = '';
  if (S.tab==='table') ctx = '<button class="prompt" data-act="sort"><span class="btn-x" aria-hidden="true">X</span>Sort</button>';
  if (S.tab==='results' && gws.length) ctx = '<button class="prompt" data-act="prevGw" aria-label="Previous gameweek"><span class="key">LT</span></button><button class="prompt" data-act="nextGw" aria-label="Next gameweek"><span class="key">RT</span></button><span class="plabel">Gameweek</span>';
  $('fctx').innerHTML = ctx;
  const centre = (box, el) => { if (box && el) box.scrollLeft = el.offsetLeft - (box.clientWidth - el.offsetWidth) / 2; };
  centre($('tabs'), $('tabs').querySelector('.on'));
  document.querySelectorAll('.mlist').forEach(b => centre(b, b.querySelector('.on')));
}
let lastW = window.innerWidth;
window.addEventListener('resize', () => { if ((window.innerWidth <= 640) !== (lastW <= 640)) { lastW = window.innerWidth; render(); } });

function step(d){ const i = TABS.findIndex(t => t[0]===S.tab); S.tab = TABS[(i + d + TABS.length) % TABS.length][0]; }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-mgr],[data-act]'); if (!b) return;
  if (b.dataset.tab) S.tab = b.dataset.tab;
  else if (b.dataset.mgr) S.mgr = b.dataset.mgr;
  else switch (b.dataset.act) {
    case 'prevTab': step(-1); break;
    case 'nextTab': step(1); break;
    case 'sort': S.sort = S.sort==='pts' ? 'pf' : 'pts'; break;
    case 'prevGw': S.gw = Math.max(gws[0], S.gw-1); break;
    case 'nextGw': S.gw = Math.min(gws[gws.length-1], S.gw+1); break;
  }
  render();
});

render();
</script>
</body>
</html>
